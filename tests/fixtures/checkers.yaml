#
# The sample game the theme-sets page draws the Checkers sheets from: game 6 of
# @tannergolden against GitHub, played as American checkers, so GitHub's Black
# moved first and the house plays White, as it always does. On GitHub's
# eleventh move the house has just jumped a man back, and GitHub must jump
# again. The game itself is drawn on @tannergolden's profile alone, where every
# move is played live; its players here are driftmark's contributors, and as
# fictional as they are.

elements:
  checkers:
    kind: checkers
    fen: "B:W11,21,24,25,27,28,29,30,32:B2,4,5,6,8,9,14,18"
    game: 6
    move: 11
    players: 11
    due: 18 Oct
    alert: must jump
    last:
      move: 20x11
      words: Man from 20 jumps 16, landing on 11
      by: "@tannergolden"
      when: 12 Oct
    kings: {house: 0, github: 0}
    history:
      - [9, 1-6, 22x15, "@sunnypatel"]
      - [10, 11x18, 20x11, "@hollyfenwick"]
      - [11, "", "", ""]
    prompt: "🟢 **GitHub's turn as Black!** A jump is waiting, and it must be taken, by 18 Oct."
    note: "GitHub opens every game with the Black men, as American checkers has it. A jump must be taken when there is one, and the first move to arrive is the one played."
    moves:
      - ["⚔️", "Board Them!", 8x15, "Man from 8 jumps 11, landing on 15", "https://github.com/tannergolden/play/issues/new?template=move.yml&title=checkers%3A%208x15%20%C2%B7%20game%206%20%C2%B7%20move%2021"]
