      - ["⚠️", "Land Behind Your Own Lines!", 4+, "A Black disc down column 4, to row 5, threatening column 4", "https://github.com/tannergolden/play/issues/new?template=move.yml&title=connectfour%3A%204%20%C2%B7%20game%204%20%C2%B7%20move%2017"]
