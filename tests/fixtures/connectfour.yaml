#
# The sample game the theme-sets page draws the Connect Four sheets from: game 4
# of @tannergolden against GitHub, which the Arbiter opened for GitHub, so
# GitHub's Black disc dropped first and the house drops White, as it always
# does. On GitHub's ninth move the house threatens column 7, and GitHub must
# block it. The game itself is drawn on @tannergolden's profile alone, where
# every move is played live; its players here are driftmark's contributors, and
# as fictional as they are.

elements:
  connectfour:
    kind: connectfour
    board: ......./..D..../..LD.../..DD.../D.DLLL./L.DLDLL
    opens: github
    game: 4
    move: 9
    players: 7
    due: 18 Oct
    last:
      move: 5+
      words: A White disc down column 5, to row 2, threatening column 7
      by: "@tannergolden"
      when: 12 Oct
    threats: {house: [7], github: []}
    history:
      - [7, "4", "6", "@devonaraki"]
      - [8, "4", 5+, "@hollyfenwick"]
      - [9, "", "", ""]
    prompt: "🟢 **GitHub's turn as Black!** @tannergolden threatens column 7: block it, by 18 Oct."
    note: "The Arbiter opens every game for a side drawn at random, with a random first move. The first move to arrive is the one played."
    moves:
      - ["⚠️", "Jump Into the Wind!", "1", "A Black disc down column 1, to row 3", "https://github.com/tannergolden/play/issues/new?template=move.yml&title=connectfour%3A%201%20%C2%B7%20game%204%20%C2%B7%20move%2017"]
