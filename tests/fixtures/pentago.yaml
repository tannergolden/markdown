#
# The sample game the theme-sets page draws the Pentago sheets from: game 4 of
# @tannergolden against GitHub, under the Ghost Rule. The Arbiter drew the house
# to set the first ghost, and it set b5, the centre of the upper left quarter,
# which no turn moves; GitHub set f6, which its quarter has turned to d4 since.
# The Arbiter drew the house to set the first marble, so White moved first, as
# the house always plays White. On move 7 the house set d5 and turned the upper
# right quarter clockwise, and it is GitHub's turn; the sheet says nothing of
# what any hole or turn would do: nothing on a board helps a player choose. The
# game itself is drawn on @tannergolden's profile alone, where every move is
# played live; its players here are driftmark's contributors, and as fictional
# as they are.

