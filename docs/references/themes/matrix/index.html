-pin-talkative-day.svg","dark":"matrix-rabbit/trophy-pin-talkative-dark.svg"},{"label":"Used By","w":104,"h":124,"day":"matrix-rabbit/trophy-pin-used-by-day.svg","dark":"matrix-rabbit/trophy-pin-used-by-dark.svg"},{"label":"Ghost","w":104,"h":124,"day":"matrix-rabbit/trophy-pin-ghost-day.svg","dark":"matrix-rabbit/trophy-pin-ghost-dark.svg"}]}]}]},{"key":"matrix-dojo","name":"Dojo","n":5,"month":"May","drawn":true,"tagline":"A dojo of shoji and tatami: lacquer and gold-leaf titles, drifting petals, a flying kick and lanterns burning by night.","about":"A dojo built of shoji: honey paper behind a lattice of pale hinoki by day, and by night the same paper glowing deep indigo with the city's light behind it, the kumiko standing out against it in silhouette. Black lacquered beams frame every sheet with gold fittings at their joints, the edge of a tatami runs along the foot in black brocade worked in gold, and a shimenawa of twisted straw hangs along the top with its zigzags of white paper. Titles are black lacquer edged in gold leaf and brushed, the dry brush fraying at a stroke's end, and by night they are gold leaf catching the light, while cherry petals drift across the sky behind them. The H1 is the training program: a fighter in a dark gi at the top of a flying kick, his afterimages trailing behind him, over a byobu laid in gold leaf and painted with a great wave, a paper lantern written in the code hanging by him; and across the floor his opponent waiting in his guard under a great round window onto the city of code, beside a stone lantern that by night burns phosphor and pools its light on the tatami. A section's header sets the two of them before a byobu painted with a great pine, the kick at the guard; a strip's slides the shoji open on the garden, where a pagoda rises among cherry blossom under the moon. On a phone the whole dojo stands across the width under the words, and a section's and a strip's phones stand the clash and the pagoda there. Footers stand on the dojo's floor, a dais of hinoki rising where the cells leave room and the alcove after the last cell, a hanging scroll between two paper lanterns; links hang from a straw rope; badges carry the rope over lacquered blocks; and the elements are lacquered boxes, silk cords hung with paper lanterns, bamboo, a taiko's rim, dyed textiles, name plates of hinoki, banners on the rope and a vermilion seal. The games are played on tatami and vermilion lacquer in a frame of black lacquer, and the Hall of Fame's podium is black lacquer hung with banners.","swatches":[{"role":"title, day","hex":"#150B0A"},{"role":"accent, day","hex":"#99241A"},{"role":"body, day","hex":"#0B1F14"},{"role":"title, night","hex":"#E0BE55"},{"role":"accent, night","hex":"#E0BE55"},{"role":"body, night","hex":"#CFF5D9"}],"colours":201,"hero":{"day":"matrix-dojo/h1-still-day.svg","dark":"matrix-dojo/h1-still-dark.svg"},"use":"theme: matrix-dojo","sign":"go","sections":[{"key":"headers","title":"Headers","note":"Wide, as a README shows them on a desktop. Each one moves; a reader who asks for reduced motion gets its still pair, which Motion: Still shows here.","items":[{"label":"H1 Sheet","w":830,"h":264,"cap":48000,"size":40536,"day":"matrix-dojo/h1-day.svg","dark":"matrix-dojo/h1-dark.svg","sday":"matrix-dojo/h1-still-day.svg","sdark":"matrix-dojo/h1-still-dark.svg"},{"label":"H2 Section","w":830,"h":302,"cap":48000,"size":37816,"day":"matrix-dojo/h2-day.svg","dark":"matrix-dojo/h2-dark.svg","sday":"matrix-dojo/h2-still-day.svg","sdark":"matrix-dojo/h2-still-dark.svg"},{"label":"H3 Strip","w":830,"h":208,"cap":48000,"size":28791,"day":"matrix-dojo/h3-day.svg","dark":"matrix-dojo/h3-dark.svg","sday":"matrix-dojo/h3-still-day.svg","sdark":"matrix-dojo/h3-still-dark.svg"},{"label":"H2 Section, on a profile","w":830,"h":288,"cap":48000,"size":37835,"day":"matrix-dojo/h2-profile-day.svg","dark":"matrix-dojo/h2-profile-dark.svg","sday":"matrix-dojo/h2-profile-still-day.svg","sdark":"matrix-dojo/h2-profile  grow us, ashen lavender by day and by night a black-purple storm, framed in ribbed black conduit with cables hung in swags across the top, storm clouds drifting across it and green lightning crawling through them. Titles are glass tubes of glowing phosphor fluid, capped in dark metal, bubbles rising through them. The headers open on the fields: a tower of glass pods glowing green, each holding a sleeper curled in its fluid, cables running up into the dark and the next towers fading into the haze beyond it; and the harvester, a spidery machine of knuckled arms and red eyes, clinging to a tower and plucking a pod from it, while the towers of the fields stand in rows to the horizon along the foot. A section's header stands the awakening, a sleeper risen gasping out of an open pod as the doctor is let down from the dark to pull his jacks, and a strip's the pod tree, its cables arching out like a willow's boughs hung with glowing pods. A pod lies beside SECTION A-A and stands beside a strip's title, and lengths of cable lie along the rule. On a phone the whole of the fields stands under the words, and a section's and a strip's heroes under theirs. The footer stands on the trench's cables with a pod in its socket, glowing by night; links are metal plates under ribbed conduit; the elements are control panels, cables carrying the code, tubes of the fluid and the machines' red eyes; badges wear a band of conduit; and the games are played on glass and riveted metal, their winners standing on a podium of dark metal, cobwebbed in its corners.","swatches":[{"role":"title, day","hex":"#004F48"},{"role":"accent, day","hex":"#3D2A55"},{"role":"body, day","hex":"#0B1F14"},{"role":"title, night","hex":"#2BD46A"},{"role":"accent, night","hex":"#7BF496"},{"role":"body, night","hex":"#CFF5D9"}],"colours":109,"hero":{"day":"matrix-harvest/h1-still-day.svg","dark":"matrix-harvest/h1-still-dark.svg"},"use":"theme: matrix-harvest","sign":"juu","sections":[{"key":"headers","title":"Headers" au","name":"Chateau","n":11,"month":"November","drawn":true,"tagline":"A banquet by candlelight in a chateau hung with silk and gilt, where every candle burns code green.","about":"Every sheet is a wall of the chateau hung with silk damask, champagne gold by day and wine-dark by night, woven in an ogee lattice with a lily in each cell and held in a gilded frame strung with beads, which deepens along a header's top into a frieze of egg and dart between corner blocks carved with rosettes, two acanthus scrolls framing the month's mark as a cartouche would and a valance of red velvet swags hung under it, and across the sky behind the title the chandeliers' crystal throws a shimmer of light over the silk. Titles are gold leaf on carved letters, chiselled so one face of every stroke takes the light and the other falls into shade, and in a moving header the candles glint on them. Headers open on the hall, where two marble columns frame a grand staircase, its red carpet running down the marble steps under brass rods to a lamp on each newel post and climbing to a tall arched window with the moon in it by night, crystal chandeliers hung over it all; the carpet runs on along the floor to the banquet, the end of a long table in white linen set with a candelabrum, a tiered chocolate cake and goblets of wine, two swords crossed behind a gilded shield on the wall above, and a guest in a long dark coat and dark glasses standing before it with a sword drawn. The section header is the salon's fireplace, three green flames leaping in its hearth of white marble under a pier glass in a gilt frame, a torchere burning at either side, and the strip's suit of armour stands its full height under a red banner with its halberd. On a phone the whole chateau lies under the words, the guest warms himself at the fireplace, and two suits of armour guard the trophy of swords. Every candle burns on the hand's phosphor, for in the Matrix every flame is code, and by night its green light is the only light the hall has, pooling on the stair, the linen, the hearth and the floor and glinting in the guest's glasses. Footers stand on the red carpet under a gilt rod, a marble balustrade rising behind it and the gilded shield between two sconces hung after the last cell; links are red velvet buttons in gilt beads, and badges wear a string of gilt beads along their top. The elements are cut from the same marble, gilt, velvet and crystal: marble columns crowned in gold, a beaded gilt dial, a velvet rope with a candle for every release, cameos in oval gilt frames and a seal ringed with gilt petals; the boards are white marble and mahogany parquet, and the winners stand on a crenellated podium of veined white marble.","swatches":[{"role":"title, day","hex":"#63360F"},{"role":"accent, day","hex":"#74121E"},{"role":"body, day","hex":"#0B1F14"},{"role":"title, night","hex":"#F2D77E"},{"role":"accent, night","hex":"#F2D77E"},{"role":"body, night","hex":"#CFF5D9"}],"colours":147,"hero":{"day":"matrix-chateau/h1-still-day.svg","dark":"matrix-chateau/h1-still-dark.svg"},"use":"theme: matrix-chateau","sign":"juuichi","sections":[{"key":"headers","title":"Headers","note":"Wide, as a README shows them on a desktop. Each one moves; a reader who asks for reduced motion gets its still pair, which Motion: Still shows here.","items":[{"label":"H1 Sheet","w":830,"h":264,"cap":48000,"size":42991,"day":"matrix-chateau/h1-day.svg","dark":"matrix-chateau/h1-dark.svg","sday":"matrix-chateau/h1-still-day.svg","sdark":"matrix-chateau/h1-still-dark.svg"},{"label":"H2 Section","w":830,"h":302,"cap":48000,"size":37715,"day":"matrix-chateau/h2-day.svg","dark":"matrix-chateau/h2-dark.svg","sday":"matrix-chateau/h2-still-day.svg","sdark":"matrix-chateau/h2-still-dark.svg"},{"label":"H3 Strip","w":830,"h":208,"cap":48000,"size":29055,"day":"matrix-chateau/h3-day.svg","dark":"matrix-chateau/h3-dark.svg","sday":"matrix-chateau/h3-still-day.svg","sdark":"matrix-chateau/h3-still-dark.svg"},{"label":"H2 Sect ght. Headers open on the year in review: three big sets at the left showing the code running, the two pills held out and the white rabbit; four more at the right showing the train, the hovercraft, the pods and the chateau's chandelier over the console, its monitor showing the room itself; and before it the Architect seated in his tall white wingback, the cables wiring the sets together lying along the floor. The section header stands the Architect before a tower of sets with his pen held up to the screens, and the strip his empty chair before a column of sets rising its full height, the cables of both climbing to the ceiling. On a phone the whole room lies under the words, and the Architect and his empty chair stand under theirs. Every screen burns on the hand's phosphor, the code runs down January's tube, a ripple of snow passes through the year's sets now and then, and by night their green light falls on the plastic, the leather, the steel and the Architect, and pools on the floor. Footers stand on the edge of the Architect's console with its meter bridge rising behind it and a set showing the room after the last cell; links are charcoal sets with vents along their tops, and badges wear a band of charcoal plastic with a green power light. The elements are built of the room's sets, cables and tubes: level meters, a bezel on a brass knob, a cable with a set for every release and the pen at today, and a seal ringed in a test card's rings over the white rabbit; the boards are the white room's tiles and pale grey plastic, and the winners stand on a plain podium of the wingback's white leather.","swatches":[{"role":"title, day","hex":"#17191E"},{"role":"accent, day","hex":"#004F48"},{"role":"body, day","hex":"#0B1F14"},{"role":"title, night","hex":"#7BF496"},{"role":"accent, night","hex":"#7BF496"},{"role":"body, night","hex":"#CFF5D9"}],"colours":126,"hero":{"day":"matrix-architect/h1-still-day.svg","dark":"matrix-architect/h1-still-dark.svg"},"use":"theme: matrix-architect","sign":"juuni","sections":[{"key":"headers","title":"Headers","note":"Wide, as a README shows them on a desktop. Each one moves; a reader who asks for reduced motion gets its still pair, which Motion: Still shows here.","items":[{"label":"H1 Sheet","w":830,"h":264,"cap":48000,"size":41221,"day":"matrix-architect/h1-day.svg","dark":"matrix-architect/h1-dark.svg","sday":"matrix-architect/h1-still-day.svg","sdark":"matrix-architect/h1-still-dark.svg"},{"label":"H2 Section","w":830,"h":302,"cap":48000,"size":36906,"day":"matrix-architect/h2-day.svg","dark":"matrix-architect/h2-dark.svg","sday":"matrix-architect/h2-still-day.svg","sdark":"matrix-architect/h2-still-dark.svg"},{"label":"H3 Strip","w":830,"h":208,"cap":48000,"size":31968,"day":"matrix-architect/h3-day.svg","dark":"matrix-architect/h3-dark.svg","sday":"matrix-architect/h3-still-day.svg","sdark":"matrix-architect/h3-still-dark.svg"},{"label":"H2 Section, on a profile","w":830,"h":288,"cap":48000,"size":39771,"day":"matrix-architect/h2-profile-day.svg","dark":"matrix-architect/h2-profile-dark.svg","sday":"matrix-architect/h2-profile-still-day.svg","sdark":"matrix-architect/h2-profile-still-dark.svg"}]},{"key":"phones","title":"On a phone","note":"The 360-pixel files a README shows on a small screen. They hold still.","items":[{"label":"H1 Sheet on a phone","w":360,"h":480,"cap":48000,"size":32772,"day":"matrix-architect/h1-phone-day.svg","dark":"matrix-architect/h1-phone-dark.svg"},{"label":"H2 Section on a phone","w":360,"h":514,"cap":48000,"size":29192,"day":"matrix-architect/h2-phone-day.svg","dark":"matrix-architect/h2-phone-dark.svg"},{"label":"H3 Strip on a phone","w":360,"h":480,"cap":48000,"size":27761,"day":"matrix-architect/h3-phone-day.svg","dark":"matrix-architect/h3-phone-dark.svg"},{"label":"F1 Title block on a phone","w":360,"h":100,"cap":48000,"size":8341,"day":"matrix-architect/f1-phone-day.svg","dark":"matrix-architect/f1-phone-dark.svg"},{"label":"F2 Scale bar on a phone","w":360,"h": <script>
(() => {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const M = read("manifest");
  const first = read("first");
  const C = M.collection;
  const months = M.months;
  const designs = months.filter((t) => t.drawn);
  const byKey = new Map(designs.map((t) => [t.key, t]));
  document.getElementById("lede").append(
    "Twelve designs, one for each month. A page with ", Object.assign(document.createElement("code"), { textContent: "theme: " + C.key }),
    " is drawn in the month's design, and the next takes over on the first of every month. Each is drawn by the kit itself "
    + "from its own samples and the driftmark specimen, on GitHub's light and dark grounds, at the size a README shows them.");
  if (M.drawn < 12) {
    const draft = document.getElementById("draft");
    draft.textContent = `Still being drawn: ${M.drawn} of 12 designs are done. A page can pick the collection once all twelve are.`;
    draft.hidden = false;
  }

  const payload = new Map(Object.entries(read("heroes")));
  const loaded = new Set();
  if (first.key) {
    for (const [path, svg] of Object.entries(first.files)) payload.set(path, svg);
    loaded.add(first.key);
  }
  const blobs = new Map();
  function src(path) {
    if (M.payload === "files") return path;
    let url = blobs.get(path);
    if (!url && payload.has(path)) {
      url = URL.createObjectURL(new Blob([payload.get(path)], { type: "image/svg+xml" }));
      blobs.set(path, url);
    }
    return url || "";
  }
  async function ensure(key) {
    if (M.payload === "files" || loaded.has(key)) return;
    const r = await fetch("themes/" + encodeURIComponent(key) + ".json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    for (const [path, svg] of Object.entries(await r.json())) payload.set(path, svg);
    loaded.add(key);
  }

  const store = {
    get(k) { try { return localStorage.getItem("collection:" + C.key + ":" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("collection:" + C.key + ":" + k, v); } catch (e) { /* a convenience only */ } },
  };
  const darkScheme = window.matchMedia("(prefers-color-scheme: dark)");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  function viewerDark() {
    const chosen = document.documentElement.getAttribute("data-theme");
    return chosen === "dark" || (chosen !== "light" && darkScheme.matches);
  }
  const keptGround = store.get("ground");
  const keptMotion = store.get("motion");
  const state = {
    key: null,
    ground: ["day", "dark", "both"].includes(keptGround) ? keptGround : null,
    motion: ["moving", "still"].includes(keptMotion) ? keptMotion : (reduce.matches ? "still" : "moving"),
  };
  const ground = () => state.ground || (viewerDark() ? "dark" : "day");
  const heroGround = () => (ground() === "both" ? (viewerDark() ? "dark" : "day") : ground());

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  };
  function img(path, w, h, alt) {
    const i = document.createElement("img");
    i.src = src(path);
    if (w) i.width = w;
    if (h) i.height = h;
    i.alt = alt;
    i.decoding = "async";
    return i;
  }
  const kb = (n) => (n / 1000).toFixed(1);
  const groundName = (side) => (side === "day" ? "light" : "dark");

  // The year. This month is the reader's own, from their clock.
  const calendar = document.getElementById("calendar");
  const thisMonth = new Date().getMonth() + 1;
  function paintHero(box, t) {
    const g = heroGround();
    box.dataset.ground = g;
    box.replaceChildren(img(t.hero[g], 830, 256, ""));
  }
  function renderCalendar() {
    for (const t of months) {
      const b = el(t.drawn ? "button" : "div", "card" + (t.drawn ? "" : " todo"));
      b.dataset.key = t.key;
      const head = el("span", "card-month");
      head.append(el("b", "", t.month));
      if (t.n === thisMonth) head.append(el("i", "now", "This month"));
      else head.append(el("i", "", String(t.n).padStart(2, "0")));
      const hero = el("span", "hero");
      hero.setAttribute("aria-hidden", "true");
      const body = el("span", "card-body");
      body.append(el("span", "card-name", t.name));
      if (t.drawn) {
        b.type = "button";
        b.setAttribute("aria-pressed", "false");
        b.setAttribute("aria-label", `${t.month}: ${t.name}`);
        paintHero(hero, t);
        if (t.tagline) body.append(el("span", "card-tag", t.tagline));
        const sw = el("span", "card-sw");
        for (const s of t.swatches.slice(0, 6)) {
          const dot = el("span");
          dot.style.background = s.hex;
          dot.title = s.role + " " + s.hex;
          sw.append(dot);
        }
        body.append(sw);
        b.addEventListener("click", () => show(t.key, "pick"));
      } else {
        hero.textContent = "To come";
        body.append(el("span", "card-tag", "Still being drawn."));
      }
      b.append(head, hero, body);
      calendar.append(b);
    }
  }
  function repaintCalendar() {
    for (const b of calendar.querySelectorAll("button.card")) paintHero(b.querySelector(".hero"), byKey.get(b.dataset.key));
  }

  // The open sheet.
  const sheet = document.getElementById("sheet");
  const status = document.getElementById("status");
  const current = document.getElementById("current");
  const sides = () => (ground() === "both" ? ["day", "dark"] : [ground()]);

  function meter(size, cap) {
    const over = size > cap;
    const w = el("span", "weight" + (over ? " over" : ""));
    const bar = el("span", "meter");
    bar.setAttribute("aria-hidden", "true");
    const fill = el("i");
    fill.style.width = Math.min(100, (size / cap) * 100).toFixed(1) + "%";
    bar.append(fill);
    w.title = over ? "Over its budget" : `${Math.round((size / cap) * 100)}% of its budget`;
    w.append(bar, el("span", "", `${kb(size)} of ${Math.round(cap / 1000)} KB`));
    return w;
  }
  function figure(t, it) {
    const f = el("figure", "draw " + (it.w >= 600 ? "wide" : "small"));
    const grounds = el("div", "grounds");
    for (const side of sides()) {
      const box = el("div", "ground " + side);
      const still = state.motion === "still" && it["s" + side];
      box.append(img(still || it[side], it.w, it.h, `${it.label}, ${t.name}, on GitHub's ${groundName(side)} ground`));
      grounds.append(box);
    }
    const cap = el("figcaption");
    cap.append(el("span", "label", it.label), el("span", "dims", `${it.w} × ${it.h} px`), meter(it.size, it.cap));
    f.append(grounds, cap);
    return f;
  }
  function chipRows(t, s) {
    const rows = el("div", "rows");
    for (const r of s.rows) {
      const row = el("div", "row");
      if (r.label) row.append(el("p", "row-label", r.label));
      for (const side of sides()) {
        const line = el("div", "chips " + side);
        for (const c of r.chips) {
          const fig = el("figure", "chip");
          fig.append(img(c[side], c.w, c.h, `${c.label}, ${t.name}, on GitHub's ${groundName(side)} ground`),
            el("figcaption", "", c.label));
          line.append(fig);
        }
        row.append(line);
      }
      rows.append(row);
    }
    return rows;
  }
  function drawingsOf(t) {
    const all = new Set();
    let heaviest = null;
    for (const s of t.sections) {
      for (const it of s.items || []) {
        for (const k of ["day", "dark", "sday", "sdark"]) if (it[k]) all.add(it[k]);
        if (!heaviest || it.size / it.cap > heaviest.size / heaviest.cap) heaviest = it;
      }
      for (const r of s.rows || []) for (const c of r.chips) { all.add(c.day); all.add(c.dark); }
    }
    return { count: all.size, heaviest };
  }
  function copyButton(text) {
    const b = el("button", "copy", "Copy");
    b.type = "button";
    b.setAttribute("aria-label", "Copy " + text);
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
      catch (e) {
        const code = b.parentElement.querySelector("code");
        const range = document.createRange();
        range.selectNodeContents(code);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        b.textContent = "Selected";
      }
      setTimeout(() => { b.textContent = "Copy"; }, 1600);
    });
    return b;
  }
  function head(t) {
    const h = el("header", "sheet-head");
    const titles = el("div");
    titles.append(el("p", "kicker", `${t.month} · design ${t.n} of 12`), el("h2", "", t.name));
    if (t.tagline) titles.append(el("p", "tagline", t.tagline));
    if (t.about) titles.append(el("p", "blurb", t.about));
    const spec = el("dl", "spec");
    const use = el("div", "use");
    const useDd = el("dd");
    const line = el("div", "use-line");
    const all = "theme: " + C.key;
    line.append(el("code", "", all), copyButton(all));
    const keep = el("span", "use-note");
    keep.append(`Draws each month's design in turn, ${t.name} in ${t.month}. Or set `, el("code", "", t.use),
      ` to keep ${t.name} all year, and `, el("code", "", "sign: " + t.sign),
      ` or any of the twelve for every header to carry that sign.`);
    useDd.append(line, keep);
    use.append(el("dt", "", "In .github/markdown.yaml"), useDd);
    const inks = el("div", "inks");
    const list = el("ul", "swatches");
    for (const s of t.swatches) {
      const li = el("li");
      const sw = el("span", "sw");
      sw.style.background = s.hex;
      li.append(sw, el("span", "sw-role", s.role), el("span", "sw-hex", s.hex.toLowerCase()));
      list.append(li);
    }
    const inksDd = el("dd");
    inksDd.append(list);
    inks.append(el("dt", "", `Its inks, of ${t.colours} colours`), inksDd);
    const { count, heaviest } = drawingsOf(t);
    const facts = el("div", "facts");
    const factsDd = el("dd");
    factsDd.append(el("span", "big", count.toLocaleString("en-US")));
    if (heaviest) factsDd.append(document.createTextNode(`Heaviest: ${heaviest.label}, ${kb(heaviest.size)} of ${Math.round(heaviest.cap / 1000)} KB.`));
    facts.append(el("dt", "", "Drawings on this sheet"), factsDd);
    spec.append(use, inks, facts);
    h.append(titles, spec);
    return h;
  }
  function part(t, s) {
    const sec = el("section", "part");
    sec.id = "part-" + s.key;
    const ph = el("div", "part-head");
    const h3 = el("h3", "", s.title);
    const n = (s.items || []).length + (s.rows || []).reduce((a, r) => a + r.chips.length, 0);
    h3.append(el("small", "", `${n} ${n === 1 ? "drawing" : "drawings"}`));
    ph.append(h3, el("p", "", s.note));
    sec.append(ph);
    if (s.items && s.items.length) {
      const grid = el("div", "drawings");
      for (const it of s.items) grid.append(figure(t, it));
      sec.append(grid);
    }
    if (s.rows && s.rows.length) sec.append(chipRows(t, s));
    return sec;
  }
  function neighbours(key) {
    const i = designs.findIndex((t) => t.key === key);
    return [designs[(i - 1 + designs.length) % designs.length], designs[(i + 1) % designs.length]];
  }
  function pager(t) {
    const [prev, next] = neighbours(t.key);
    const p = el("nav", "pager");
    p.setAttribute("aria-label", "The other months");
    for (const [cls, label, to] of [["prev", "← " + prev.month, prev], ["next", next.month + " →", next]]) {
      const b = el("button", cls);
      b.type = "button";
      b.append(el("small", "", label), el("span", "", to.name));
      b.addEventListener("click", () => show(to.key, "step"));
      p.append(b);
    }
    return p;
  }
  function renderSheet() {
    const t = byKey.get(state.key);
    sheet.dataset.ground = ground();
    sheet.replaceChildren(head(t), ...t.sections.map((s) => part(t, s)), pager(t));
  }
  function paintControls() {
    for (const b of document.querySelectorAll("[data-set-ground]")) b.setAttribute("aria-pressed", String(b.dataset.setGround === ground()));
    for (const b of document.querySelectorAll("[data-set-motion]")) b.setAttribute("aria-pressed", String(b.dataset.setMotion === state.motion));
  }

  let asked = 0;
  async function show(key, how) {
    if (!byKey.has(key)) key = designs[0].key;
    const t = byKey.get(key);
    state.key = key;
    current.textContent = `${t.month}: ${t.name}`;
    for (const c of calendar.querySelectorAll("button.card")) c.setAttribute("aria-pressed", String(c.dataset.key === key));
    if (how !== "start") {
      try { history.replaceState(null, "", "#" + key); } catch (e) { /* the address is a convenience */ }
      store.set("last", key);
    }
    const mine = ++asked;
    if (!loaded.has(key) && M.payload !== "files") {
      status.textContent = `Opening ${t.name}...`;
      sheet.setAttribute("aria-busy", "true");
      try { await ensure(key); }
      catch (e) {
        if (mine === asked) {
          status.textContent = `${t.name}'s drawings did not load. Pick it again to retry.`;
          sheet.replaceChildren();
          sheet.removeAttribute("aria-busy");
        }
        return;
      }
    }
    if (mine !== asked) return;
    status.textContent = "";
    sheet.removeAttribute("aria-busy");
    renderSheet();
    if (how === "pick" || how === "step") document.querySelector(".toolbar").scrollIntoView({ block: "start" });
  }
  function refresh() {
    paintControls();
    repaintCalendar();
    if (state.key && (loaded.has(state.key) || M.payload === "files")) renderSheet();
  }
  for (const b of document.querySelectorAll("[data-set-ground]")) {
    b.addEventListener("click", () => { state.ground = b.dataset.setGround; store.set("ground", state.ground); refresh(); });
  }
  for (const b of document.querySelectorAll("[data-set-motion]")) {
    b.addEventListener("click", () => { state.motion = b.dataset.setMotion; store.set("motion", state.motion); refresh(); });
  }
  document.getElementById("prev").addEventListener("click", () => show(neighbours(state.key)[0].key, "step"));
  document.getElementById("next").addEventListener("click", () => show(neighbours(state.key)[1].key, "step"));
  window.addEventListener("hashchange", () => {
    const key = decodeURIComponent(location.hash.slice(1));
    if (byKey.has(key) && key !== state.key) show(key, "hash");
  });
  const follow = () => { if (!state.ground) refresh(); };
  darkScheme.addEventListener("change", follow);
  new MutationObserver(follow).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  renderCalendar();
  paintControls();
  const hash = decodeURIComponent(location.hash.slice(1));
  const last = store.get("last");
  const now = designs.find((t) => t.n === thisMonth);
  show(byKey.has(hash) ? hash : byKey.has(last) ? last : (now || designs[0]).key, "start");
})();
</script>
