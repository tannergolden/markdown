#
# This repository's own page, in repository mode: the kit drawing its own
# README. It calls the reusable workflow by local path, so a change to the
# workflow, the action or the kit is exercised by the tree that carries it,
# the way the standards' self-checks do, rather than by the last release.
#
# Once a day, at midnight UTC. Every run measures everything again, so a run
# GitHub delays or drops loses nothing: the next one catches up. A day on
# which nothing the page shows has moved writes nothing.

name: '📝 Own Page'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  page:
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: write # the SVGs, the README's blocks and the lock
      pull-requests: write # only used with commit: pr
    uses: ./.github/workflows/markdown.yml
    with:
      kit-ref: ${{ github.sha }} # the tree that carries this change, not the last release
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at a local path.
