#
# This repository's own page: the umbrella eating its own cooking. It calls
# the reusable workflow by LOCAL path, so a change to it is exercised by the
# tree that carries it, rather than by the last release.
#
# Three crons, eight hours apart, one per generator repository. Each cron
# appears twice, under on.schedule so GitHub fires it and under with: so the
# workflow knows which kit it means; the two must match to the character.

name: '📖 Own README'

on:
  schedule:
    - cron: '0 0 * * *' # banners, then the elements
    - cron: '0 8 * * *' # badges
    - cron: '0 16 * * *' # trophies
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  markdown:
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: write # the SVGs, the README blocks and each kit's lock
      pull-requests: write # declared by the called workflows
    uses: ./.github/workflows/markdown.yml
    with:
      banners: '0 0 * * *'
      badges: '0 8 * * *'
      trophies: '0 16 * * *'
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at a local path.
