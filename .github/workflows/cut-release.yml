#
# --- This Repository's Own Release ---
#
# 🏷️ Cut Release
#
# Purpose: Publishes a version of the kit and moves the major tag every stub
# pins. The work happens in tannergolden/standards' release.yml, called rather
# than copied, so the guards live in one place: it refuses a commit that is not
# on the default branch and a version that does not move forward, proves the
# files below exist at the commit and that the check passes, then tags the
# immutable vX.Y.Z, force-moves vX, publishes the release with generated notes
# and prunes every older release, page and tag.
#
# ⚠️ Moving `v1` changes what every repository pinned to it runs next,
# without anyone on their side doing anything. Treat a release as a
# production change to every page at once.
#
# This is deliberately NOT the release.yml stub beside it: that one calls the
# shared publisher, which computes an information-rich tag and never writes a
# moving major, so it cannot produce the `v1` a stub resolves.
#
# The whole suite runs first, in a job of the kit's own. The shared publisher
# gives its whole job ten minutes, and `make lint test` takes six on a quick
# runner and more than ten on a slow one, which once cancelled a release
# before it was tagged. Here it has half an hour, on the very commit the
# publisher tags, since both check out the commit the run was started on,
# and the publisher's own check is then the lint alone.

name: '🏷️ Cut Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, as vX.Y.Z'
        required: true
        type: string
      move-major:
        description: 'Also move the major tag (vX) to this release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: '🧪 Verify The Release Candidate'
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # read the repository
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🧪 Verify: runs the whole suite on the commit about to be released.'

      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🧪 Lint and test'
        shell: bash
        run: |
          set -euo pipefail
          make lint test

  release:
    name: '🏷️ Publish Version & Move Major Tag'
    needs: verify
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: write # create tags, publish the release, prune superseded releases and their tags
    uses: tannergolden/standards/.github/workflows/release.yml@v1
    with:
      version: ${{ inputs.version }}
      move-major: ${{ inputs.move-major }}
      required-files: '.github/workflows/markdown.yml actions/markdown/action.yml src/markdown-kit.py src/app/run.py src/domain/data/fonts/glyphs.json src/domain/data/prints.json'
      check-command: 'make lint'
