#
# The reusable workflow a repository calls from its one stub. The stub names
# the schedule and, if it likes, the mode, the theme and the holidays; the
# checkout, the measurement, the drawing and the commit all happen here, so a
# fix lands once and reaches every README pinned to @v1.
#
# One run draws the whole page (the header and footer, the badges, the
# elements and the trophy case) and makes one commit, so a theme or a holiday
# changes the whole page at once. Everything else a page sets is in its
# .github/markdown.yaml.
#
# Called, never copied: nothing with behaviour in it is pasted into the
# caller's tree.

name: '📝 Markdown'

on:
  workflow_call:
    inputs:
      mode:
        description: 'profile, repository or organization. Empty reads the settings, which guess it by default.'
        type: string
        default: ''
      theme:
        description: >-
          The page's theme: standard, a print (blueprint, redprint, orangeprint,
          yellowprint, greenprint, tealprint, indigoprint, purpleprint,
          pinkprint, brownprint, blackprint), rainbowprint for the next colour
          on every update, or a print of the settings. Empty reads the
          settings, whose default is standard.
        type: string
        default: ''
      holidays:
        description: "'false' keeps the holiday sets away. Empty reads the settings, whose default is on."
        type: string
        default: ''
      holiday-days:
        description: "How long each holiday's set is up, 3 to 7 days; New Year's Day is always 3. Empty reads the settings."
        type: string
        default: ''
      check:
        description: >-
          true only checks: the committed page is drawn again from the
          measurement the lock keeps, and the run fails if any file or README
          block differs. Nothing is measured, written or committed, and no
          token is used. For pull-request CI.
        type: boolean
        default: false
      commit:
        description: 'push (the default) commits to the branch that ran; pr opens or updates one pull request.'
        type: string
        default: 'push'
      commit-branch:
        description: 'The branch the pull request rides on when commit is pr.'
        type: string
        default: 'chore/markdown'
      kit-ref:
        description: >-
          The tannergolden/markdown ref to run: the v1 tag by default. This
          repository's own page passes its commit, so a change is exercised by
          the tree that carries it.
        type: string
        default: 'v1'
      author:
        description: >-
          Who the refresh commit is authored by, as "Name <email>": the kit's
          author by default, since the drawing is the kit's, and the bot signs
          for it as committer. The kit recognises its own commits by their
          scope and never counts one as a person's.
        type: string
        default: 'Tanner Golden <24684994+tannergolden@users.noreply.github.com>'
    secrets:
      MARKDOWN_TOKEN:
        description: >-
          Optional token to measure with instead of GITHUB_TOKEN: a read-only
          personal token also counts private contributions. Nothing public
          needs one.
        required: false
    outputs:
      changed:
        description: "'true' when the run committed something."
        value: ${{ jobs.markdown.outputs.changed }}
      summary:
        description: 'One line about the page.'
        value: ${{ jobs.markdown.outputs.summary }}

permissions: {}

jobs:
  markdown:
    name: '📝 Measure and draw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the SVGs, the README's blocks, the documents a localized badge is linked from, and the lock
      pull-requests: write # only used when commit is pr
    outputs:
      changed: ${{ steps.page.outputs.changed }}
      summary: ${{ steps.page.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch as it is now, not as it was when the run was queued.
          ref: ${{ github.ref_name }}
          # The elements read the whole log and every tag.
          fetch-depth: 0
          # The bot commits the drawing, so the checkout keeps credentials for the push below.
          persist-credentials: true # zizmor: ignore[artipacked] - the push below needs them, and nothing else runs after it.

      # A reusable workflow runs against the caller's checkout, so the kit is
      # fetched beside it and run by local path. The action keeps the folder
      # out of git's view; nothing of it reaches the caller's tree.
      - name: '📥 Fetch the kit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tannergolden/markdown
          ref: ${{ inputs.kit-ref }}
          path: .markdown-kit
          persist-credentials: false

      - id: page
        name: '📝 The page'
        uses: ./.markdown-kit/actions/markdown
        with:
          command: ${{ inputs.check && 'check' || 'run' }}
          mode: ${{ inputs.mode }}
          theme: ${{ inputs.theme }}
          holidays: ${{ inputs.holidays }}
          holiday-days: ${{ inputs.holiday-days }}
          token: ${{ secrets.MARKDOWN_TOKEN || github.token }}

      # Authored by the kit's author and committed by the bot, so the page
      # says who drew it and the log what pushed it. The message is the one
      # the kit wrote for this run: a Conventional Commit per
      # tannergolden/standards, with values that make it unique.
      - name: '📤 Commit and push'
        if: ${{ !inputs.check && steps.page.outputs.changed == 'true' && inputs.commit != 'pr' }}
        shell: bash
        env:
          MESSAGE_FILE: ${{ steps.page.outputs.commit-file }}
          AUTHOR: ${{ inputs.author }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --author="$AUTHOR" -F "$MESSAGE_FILE"
          # Something else may have pushed since the run began: the drawing is
          # replayed onto whatever the branch holds now, and pushed from there.
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: '🧾 Word the pull request'
        id: author
        if: ${{ !inputs.check && steps.page.outputs.changed == 'true' && inputs.commit == 'pr' }}
        shell: bash
        env:
          AUTHOR: ${{ inputs.author }}
        run: |
          set -euo pipefail
          rm -rf .markdown-kit
          # "Name <email>" split for git's author variables
          name="${AUTHOR%%<*}"
          email="${AUTHOR#*<}"
          {
            echo "name=${name% }"
            echo "email=${email%>}"
          } >> "$GITHUB_OUTPUT"

      # open-pr commits with git, so the author variables reach it and name the
      # same author as the push above; the committer stays its own.
      - name: '🔀 Open or update the pull request'
        if: ${{ !inputs.check && steps.page.outputs.changed == 'true' && inputs.commit == 'pr' }}
        uses: tannergolden/standards/actions/open-pr@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls standards.
        env:
          GIT_AUTHOR_NAME: ${{ steps.author.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.author.outputs.email }}
        with:
          token: ${{ github.token }}
          branch: ${{ inputs.commit-branch }}
          commit-title: ${{ steps.page.outputs.commit-title }}
          commit-body: ${{ steps.page.outputs.commit-body }}
